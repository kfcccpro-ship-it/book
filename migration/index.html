<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MG 교재관리 Firebase Migration Test</title>
  <style>
    body{font-family:Arial,"Noto Sans KR",sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:32px}
    .box{max-width:780px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 8px 28px rgba(15,23,42,.08)}
    h1{font-size:24px;margin:0 0 10px}.muted{color:#64748b;line-height:1.7}
    pre{background:#0f172a;color:#e2e8f0;padding:16px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
    .ok{color:#047857;font-weight:700}.bad{color:#b91c1c;font-weight:700}
  </style>
</head>
<body>
  <div class="box">
    <h1>Firebase Migration Test Loader</h1>
    <p class="muted">기존 운영 앱 코드를 Firebase DB 어댑터로 실행하되, 앱 시작 시 사용자/과정 데이터를 자동 수정·삽입하는 레거시 초기화 쓰기는 차단합니다.</p>
    <p id="status">테스트 페이지를 준비하고 있습니다...</p>
    <pre id="detail">대기 중</pre>
  </div>
<script>
(async function () {
  const status = document.getElementById('status');
  const detail = document.getElementById('detail');
  const sourceUrl = 'https://raw.githubusercontent.com/kfcccpro-ship-it/book/firebase-migration/index.html';
  const adapterUrl = new URL('./firebase-compat.js?v=4', window.location.href).href;
  const writeServiceUrl = new URL('./firebase-write-service.js?v=2', window.location.href).href;
  const atomicPatchUrl = new URL('./firebase-atomic-patch.js?v=2', window.location.href).href;

  try {
    const response = await fetch(sourceUrl, { cache: 'no-store' });
    if (!response.ok) throw new Error(`index.html 다운로드 실패: HTTP ${response.status}`);
    let html = await response.text();

    const supabaseCdn = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></' + 'script>';
    if (!html.includes(supabaseCdn)) throw new Error('Supabase SDK 태그를 찾지 못했습니다. 원본 구조가 변경되었을 수 있습니다.');
    html = html.replace(supabaseCdn,
      `<script src="${adapterUrl}"></` + `script>\n` +
      `<script src="${writeServiceUrl}"></` + `script>\n` +
      `<script src="${atomicPatchUrl}"></` + `script>`
    );

    const initPattern = /const SUPABASE_URL = '[^']+';[\s\S]*?let sb;[\s\S]*?console\.error\('Supabase 초기화 실패:', e\);\s*\}/;
    if (!initPattern.test(html)) throw new Error('Supabase 초기화 블록을 찾지 못했습니다.');
    html = html.replace(initPattern, `let sb;\nwindow.__mgFirebaseReady = window.firebaseDbReady.then(client => {\n    sb = client;\n    window.__mgFirebaseClient = client;\n    return client;\n});`);

    const loadMarker = "showLoadingOverlay('🔌 Supabase 연결 중...');";
    if (!html.includes(loadMarker)) throw new Error('DOMContentLoaded 연결 시작 지점을 찾지 못했습니다.');
    html = html.replace(loadMarker, `showLoadingOverlay('🔌 Firebase 연결 중...');\n    await window.__mgFirebaseReady;`);

    // Firebase 운영 전환 중에는 기존 681건을 기준 데이터로 사용한다.
    // 레거시 앱의 시작 시 사용자 이름 보정/추가 및 INITIAL_COURSES 자동 삽입은
    // Rules가 단순해진 뒤 예기치 않은 쓰기를 만들 수 있으므로 Firebase preview에서 제거한다.
    const bootstrapPattern = /    \/\/ ── 2\. 사용자 확인 & 삽입 ──[\s\S]*?    \/\/ ── 4\. 초기 설정 ──/;
    if (!bootstrapPattern.test(html)) throw new Error('레거시 자동 초기화 쓰기 블록을 찾지 못했습니다.');
    html = html.replace(bootstrapPattern,
`    // ── 2~3. Firebase migration: 기존 이관 데이터만 사용 ──
    updateLoadingOverlay('👥 Firebase 기존 데이터 확인 중...');
    console.info('[Firebase Migration] startup seed/migration writes disabled; existing migrated data only.');

    // ── 4. 초기 설정 ──`);

    html = html.replaceAll('Supabase 연결 오류:', 'Firebase 연결 오류:');
    html = html.replace('Supabase → Settings → API Keys', 'Firebase Console → Firestore Database → 규칙 확인');
    html = html.replace('<li><strong>"Legacy anon, service_role API keys"</strong> 탭 클릭</li>', '<li>Anonymous Authentication 사용 설정 확인</li>');
    html = html.replace('<li><strong>anon public</strong> 키 복사 (eyJ...로 시작)</li>', '<li>Firestore Rules에서 인증 사용자 읽기 권한 확인</li>');
    html = html.replace('<li>Claude에게 해당 키 알려주기</li>', '<li>브라우저를 새로고침해 다시 확인</li>');

    const banner = `<div id="firebase-migration-banner" style="position:fixed;left:8px;bottom:8px;z-index:100000;background:#111827;color:white;border-radius:10px;padding:8px 12px;font:12px/1.4 Arial,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.3)">Firebase preview · <span id="firebase-migration-uid">UID 확인 중...</span> · <span id="firebase-atomic-state">원자적 쓰기 확인 중...</span> · 자동초기화 쓰기 차단</div>\n<script>window.__mgFirebaseReady.then(function(c){var e=document.getElementById('firebase-migration-uid'); if(e) e.textContent='UID '+c.firebase.auth.currentUser.uid; localStorage.setItem('MG_FIREBASE_TEST_UID', c.firebase.auth.currentUser.uid); setTimeout(function(){var a=document.getElementById('firebase-atomic-state'); if(a) a.textContent=window.__mgAtomicPatchReady?'입고/출고 원자적 패치 준비':'원자적 패치 미확인';},300);}).catch(function(err){var e=document.getElementById('firebase-migration-uid'); if(e){e.textContent='초기화 오류 '+(err.code||err.name||'')+' '+(err.message||err);e.style.color='#fecaca';} console.error(err);});</` + `script>`;
    html = html.replace(/<body([^>]*)>/i, `<body$1>${banner}`);

    status.innerHTML = '<span class="ok">변환 완료. Firebase 테스트 앱을 시작합니다...</span>';
    detail.textContent = 'Source: firebase-migration/index.html\nAdapter: Firebase compat\nStartup seed writes: DISABLED\nAtomic write layer: group stock-in + stock-out\nProduction root index.html: 변경 없음';

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    console.error(error);
    status.innerHTML = '<span class="bad">테스트 로더 실패</span>';
    detail.textContent = error.stack || error.message || String(error);
  }
})();
</script>
</body>
</html>
