<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MG Firebase 유지보수 원자적 쓰기 테스트</title><style>body{font-family:Arial,"Noto Sans KR",sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:28px}.box{max-width:920px;margin:auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:26px;box-shadow:0 8px 28px rgba(15,23,42,.08)}h1{font-size:24px}.ok{color:#047857;font-weight:700}.bad{color:#b91c1c;font-weight:700}.muted{color:#64748b;line-height:1.6}button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;background:#2563eb;color:white}button:disabled{background:#94a3b8}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border-bottom:1px solid #e5e7eb;padding:9px;text-align:left}pre{background:#0f172a;color:#e5e7eb;padding:14px;border-radius:10px;white-space:pre-wrap}</style></head><body><div class="box"><h1>유지보수/과정 CRUD 원자적 거래 테스트</h1><p class="muted">실제 업무 과정은 사용하지 않습니다. 전용 테스트 과정 1건을 생성한 뒤 재고수정 → 출고수정 → 출고초기화 → 과정명수정 → 과정삭제+로그까지 검증하고 테스트 로그를 모두 삭제해 기준선으로 복원합니다.</p><p id="status">준비 중...</p><button id="run" disabled>전체 유지보수 테스트 실행</button><table><tbody><tr><th>1. 인증/서비스</th><td id="r1">대기</td></tr><tr><th>2. 기준선</th><td id="r2">대기</td></tr><tr><th>3. 과정 생성+로그</th><td id="r3">대기</td></tr><tr><th>4. 재고 수정+로그</th><td id="r4">대기</td></tr><tr><th>5. 출고량 수정+로그</th><td id="r5">대기</td></tr><tr><th>6. 출고 초기화+로그</th><td id="r6">대기</td></tr><tr><th>7. 과정명 수정+로그</th><td id="r7">대기</td></tr><tr><th>8. 과정 삭제+로그</th><td id="r8">대기</td></tr><tr><th>9. 로그 연속성</th><td id="r9">대기</td></tr><tr><th>10. 정리/기준선 복원</th><td id="r10">대기</td></tr></tbody></table><pre id="log">대기 중</pre></div><script src="./firebase-compat.js?v=5"></script><script src="./firebase-write-service.js?v=3"></script><script type="module">import{collection,doc,getDoc,getDocs,query,where,writeBatch,getCountFromServer}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const $=id=>document.getElementById(id),run=$('run'),status=$('status'),logEl=$('log');let client,db,svc,uid,cid;const actor={name:'MIGRATION_TEST',role:'system-test'};function mark(n,t,ok=true){const e=$('r'+n);e.textContent=t;e.className=ok?'ok':'bad'}function log(s){logEl.textContent=(logEl.textContent==='대기 중'?'':logEl.textContent+'\n')+s}async function counts(){const[c,w]=await Promise.all([getCountFromServer(collection(db,'courses')),getCountFromServer(collection(db,'work_logs'))]);return{courses:c.data().count,work_logs:w.data().count}}async function logsFor(){return getDocs(query(collection(db,'work_logs'),where('course_id','==',cid)))}async function cleanup(){const b=writeBatch(db),c=await getDoc(doc(db,'courses',cid)),ls=await logsFor();if(c.exists())b.delete(c.ref);ls.forEach(x=>b.delete(x.ref));if(c.exists()||!ls.empty)await b.commit()}try{[client,svc]=await Promise.all([window.firebaseDbReady,window.firebaseWriteServiceReady]);db=client.firebase.db;uid=client.firebase.auth.currentUser?.uid;if(!uid)throw new Error('UID 없음');cid='migration_maint_test_'+uid;mark(1,'PASS · Auth + atomic service 준비');status.innerHTML='<span class="ok">준비 완료</span>';run.disabled=false}catch(e){mark(1,'FAIL · '+e.message,false);status.innerHTML='<span class="bad">초기화 실패</span>'}run.onclick=async()=>{run.disabled=true;logEl.textContent='';let base;try{await cleanup();base=await counts();mark(2,`PASS · courses ${base.courses} / work_logs ${base.work_logs}`);const now=()=>new Date().toISOString();let t=now();await svc.insertCourseWithLog({course:{id:cid,course_name:'[MIGRATION TEST] Maintenance',status:'입고완료',stock_quantity:50,released_quantity:20,student_count:20,start_date:'2099-02-01T00:00:00.000Z',end_date:'2099-02-02T00:00:00.000Z',created_at:t,updated_at:t,migration_test_only:true},actor,log:{course_name:'[MIGRATION TEST] Maintenance',action_type:'추가',action_date:t,previous_status:null,new_status:'입고완료',notes:'maintenance test create'}});mark(3,'PASS · 과정 생성+로그');t=now();await svc.updateCourseWithLog({courseId:cid,expectedStatus:'입고완료',actor,updates:{stock_quantity:60,updated_at:t},log:{course_name:'[MIGRATION TEST] Maintenance',action_type:'수정',action_date:t,quantity:10,previous_status:'입고완료',new_status:'입고완료',notes:'재고 수정 50→60'}});mark(4,'PASS · 재고 50→60 + 로그');t=now();await svc.updateCourseWithLog({courseId:cid,expectedStatus:'입고완료',actor,updates:{released_quantity:25,updated_at:t},log:{course_name:'[MIGRATION TEST] Maintenance',action_type:'수정',action_date:t,previous_status:'입고완료',new_status:'입고완료',notes:'출고량 수정 20→25'}});mark(5,'PASS · 출고량 20→25 + 로그');t=now();await svc.updateCourseWithLog({courseId:cid,expectedStatus:'입고완료',actor,updates:{released_quantity:0,actual_release_date:null,confirmed_by:null,confirmed_at:null,updated_at:t},log:{course_name:'[MIGRATION TEST] Maintenance',action_type:'수정',action_date:t,previous_status:'입고완료',new_status:'입고완료',notes:'출고 초기화'}});mark(6,'PASS · 출고초기화 + 로그');t=now();await svc.updateCourseWithLog({courseId:cid,expectedStatus:'입고완료',actor,updates:{course_name:'[MIGRATION TEST] Maintenance Renamed',updated_at:t},log:{course_name:'[MIGRATION TEST] Maintenance Renamed',action_type:'수정',action_date:t,previous_status:'입고완료',new_status:'입고완료',notes:'과정명 수정'}});mark(7,'PASS · 과정명 수정 + 로그');t=now();await svc.deleteCourseWithLog({courseId:cid,expectedStatus:'입고완료',actor,log:{course_name:'[MIGRATION TEST] Maintenance Renamed',action_type:'삭제',action_date:t,previous_status:'입고완료',new_status:'삭제됨',notes:'과정 삭제'}});const deleted=await getDoc(doc(db,'courses',cid));if(deleted.exists())throw new Error('과정 삭제 실패');mark(8,'PASS · 과정 삭제 + 삭제로그');let ls=await logsFor();if(ls.size!==6)throw new Error('로그 수 불일치 '+ls.size);mark(9,'PASS · 테스트 로그 6건 모두 존재');const b=writeBatch(db);ls.forEach(x=>b.delete(x.ref));await b.commit();const after=await counts();if(after.courses!==base.courses||after.work_logs!==base.work_logs)throw new Error(`복원 실패 ${after.courses}/${after.work_logs}`);mark(10,`PASS · ${after.courses}/${after.work_logs} 기준선 복원`);status.innerHTML='<span class="ok">ATOMIC MAINTENANCE TEST PASS · 전체 검증 완료</span>';log('기준선 '+base.courses+'/'+base.work_logs+' → 최종 '+after.courses+'/'+after.work_logs)}catch(e){console.error(e);status.innerHTML='<span class="bad">TEST FAIL · '+e.message+'</span>';log('ERROR '+(e.stack||e.message));try{await cleanup()}catch(_){}}finally{run.disabled=false}};</script></body></html>
