<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>재고 정합성 요약</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}h1{font-size:24px;margin:0 0 6px}.sub{font-size:13px;color:#64748b;line-height:1.55}.safe{margin:14px 0;background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:13px;color:#1e40af;font-size:13px;line-height:1.5}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:13px;min-height:50px;padding:0 16px;font-weight:900;font-size:15px}.blue{background:#2563eb;color:#fff}.dark{background:#0f172a;color:#fff}.light{background:#e2e8f0;color:#334155}.btn:disabled{opacity:.45}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.card{background:#fff;border:1px solid #dbe3ef;border-radius:15px;padding:12px}.k{font-size:11px;color:#64748b;font-weight:800}.v{font-size:24px;font-weight:950;margin-top:4px}.bad{color:#dc2626}.warn{color:#c2410c}.purple{color:#7c3aed}textarea{width:100%;min-height:55vh;border:1px solid #cbd5e1;border-radius:14px;background:#fff;padding:13px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto}.msg{font-size:13px;font-weight:850;margin:10px 0;color:#15803d}.fatal{background:#7f1d1d;color:#fff;border-radius:14px;padding:13px;margin:12px 0;font-weight:850}@media(min-width:680px){.cards{grid-template-columns:repeat(6,1fr)}}
</style></head><body><div class="wrap"><h1>재고 정합성 요약</h1><div class="sub">이전 운영 앱 계산식과 현재 Simple 계산식을 같은 Firebase 데이터로 비교합니다.</div><div class="safe"><b>읽기 전용</b> · 데이터를 수정하지 않습니다. 결과를 복사해서 ChatGPT에 붙여넣기 위한 페이지입니다.</div><div class="buttons"><button id="run" class="btn blue">① 전수점검 실행</button><button id="copy" class="btn dark" disabled>② 결과 복사</button><button class="btn light" onclick="location.href='./'">돌아가기</button></div><div id="msg" class="msg"></div><div id="fatal"></div><div id="cards" class="cards"></div><textarea id="out" readonly placeholder="전수점검을 실행하면 결과가 여기에 나타납니다."></textarea></div>
<script src="../migration/firebase-compat.js?v=8"></script><script>
const RELEASED=['출고완료','출고확인','세팅중','세팅완료대기','세팅완료'];
const $=s=>document.querySelector(s),n=v=>Number(v||0)||0;
function legacyName(name){const s=String(name||'');return s.replace(/\s*\d+차(\([^)]*\))?$/,'').trim()||s.trim()}
function legacyKey(name){return legacyName(name).replace(/\s+/g,'')}
function simpleName(name){const s=String(name||'');return s.replace(/\s*(?:제\s*)?\d+\s*차(?:\s*.*)?$/,'').trim().replace(/\s+/g,' ')||s.trim()}
function simpleKey(c){return String(c.inventory_group_key||simpleName(c.course_name)).replace(/\s+/g,'').toLowerCase()}
function imported(c){return c.inventory_only!==true&&c.inventory_ledger_only!==true}
function statusText(cs){const m=new Map();for(const c of cs){const k=String(c.status||'상태없음');if(!m.has(k))m.set(k,{count:0,rel:0});const x=m.get(k);x.count++;x.rel+=n(c.released_quantity)}return [...m].map(([k,v])=>`${k}:${v.count}건/${v.rel}권`).join(', ')}
function audit(courses){const old=new Map();for(const c of courses.filter(imported)){const k=legacyKey(c.course_name);if(!old.has(k))old.set(k,{name:legacyName(c.course_name),cs:[],stock:0,oldRel:0,rawRel:0,skeys:new Set()});const g=old.get(k);g.cs.push(c);g.stock+=n(c.stock_quantity);g.rawRel+=n(c.released_quantity);if(RELEASED.includes(c.status))g.oldRel+=n(c.released_quantity);g.skeys.add(simpleKey(c))}
 const simp=new Map();for(const c of courses){const k=simpleKey(c);if(!simp.has(k))simp.set(k,{cs:[],stock:0,rel:0});const g=simp.get(k);g.cs.push(c);g.stock+=Math.max(0,n(c.stock_quantity));g.rel+=Math.max(0,n(c.released_quantity))}
 const back=new Map();for(const [lk,g] of old)for(const sk of g.skeys){if(!back.has(sk))back.set(sk,new Set());back.get(sk).add(lk)}
 const rows=[];for(const [lk,g] of old){let ss=0,sr=0,extra=0;const merged=new Set();for(const sk of g.skeys){const sg=simp.get(sk);if(sg){ss+=sg.stock;sr+=sg.rel;extra+=sg.cs.filter(c=>!imported(c)).length}for(const x of (back.get(sk)||[]))merged.add(x)}const oldBal=g.stock-g.oldRel,sBal=ss-sr,diff=sBal-oldBal,excluded=g.rawRel-g.oldRel;const causes=[];if(excluded)causes.push(`미완료상태 released ${excluded}권 추가차감`);if(merged.size>1)causes.push(`이전 ${merged.size}그룹→Simple 병합`);if(g.skeys.size>1)causes.push(`이전 1그룹→Simple ${g.skeys.size}그룹 분리`);if(extra)causes.push(`Simple 신규문서 ${extra}건 포함`);if(sBal<0&&oldBal>=0)causes.unshift('계산규칙 차이로 Simple 음수');rows.push({name:g.name,count:g.cs.length,stock:g.stock,oldRel:g.oldRel,oldBal,rawRel:g.rawRel,excluded,sStock:ss,sRel:sr,sBal,diff,causes,status:statusText(g.cs),cs:g.cs})}return rows.sort((a,b)=>(a.diff===0)-(b.diff===0)||a.oldBal-b.oldBal||a.name.localeCompare(b.name,'ko'))}
function cards(vals){const items=[['기존 과정',vals.imported,''],['기존 부교재',vals.subs,'purple'],['불일치',vals.mismatch,'bad'],['Simple 음수',vals.neg,'bad'],['미완료 출고량',vals.excluded,'warn'],['그룹규칙 차이',vals.grouping,'warn']];$('#cards').innerHTML=items.map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v ${x[2]}">${x[1]}</div></div>`).join('')}
async function run(){const b=$('#run');b.disabled=true;b.textContent='점검 중...';$('#fatal').innerHTML='';$('#msg').textContent='';try{const db=await window.firebaseDbReady;const [c,s,sl]=await Promise.all([db.from('courses').select('*'),db.from('sub_books').select('*'),db.from('sub_book_logs').select('*')]);for(const x of [c,s,sl])if(x.error)throw new Error(x.error.message);const courses=c.data||[],subs=s.data||[],rows=audit(courses);const mismatch=rows.filter(r=>r.diff!==0),neg=rows.filter(r=>r.sBal<0),ex=rows.filter(r=>r.excluded!==0),grp=rows.filter(r=>r.skeys>1||r.causes.some(x=>x.includes('그룹')));cards({imported:courses.filter(imported).length,subs:subs.length,mismatch:mismatch.length,neg:neg.length,excluded:ex.length,grouping:grp.length});let t='[교재 재고 정합성 전수점검 결과]\n';t+=`기존 과정: ${courses.filter(imported).length}건\n기존 부교재: ${subs.length}종\n불일치: ${mismatch.length}종\nSimple 음수: ${neg.length}종\n미완료상태 출고량 포함: ${ex.length}종\n\n`;
 t+='[불일치 항목]\n';if(!mismatch.length)t+='없음\n';for(const r of mismatch){t+=`\n- ${r.name}\n  차수: ${r.count}건 / 상태: ${r.status}\n  이전: 입고 ${r.stock}, 출고 ${r.oldRel}, 잔고 ${r.oldBal}\n  Simple: 입고 ${r.sStock}, 출고 ${r.sRel}, 잔고 ${r.sBal}\n  차이: ${r.diff>0?'+':''}${r.diff} / 미완료상태 released: ${r.excluded}\n  원인: ${r.causes.join(' / ')||'추가 분석 필요'}\n`;for(const x of r.cs)t+=`    · ${x.course_name} | 상태=${x.status||'-'} | 입고=${n(x.stock_quantity)} | released=${n(x.released_quantity)} | 이전출고반영=${RELEASED.includes(x.status)?'예':'아니오'}\n`}
 t+='\n[기존 부교재]\n';for(const x of subs){const bal=n(x.stock_quantity)-n(x.released_quantity);t+=`- ${x.book_name||'부교재'} | 연결=${x.course_group_name||x.course_group_key||'-'} | 입고=${n(x.stock_quantity)} | 출고=${n(x.released_quantity)} | 잔고=${bal}\n`}
 const news=courses.filter(c=>!imported(c));t+='\n[Simple 신규 전용문서]\n';if(!news.length)t+='없음\n';for(const x of news)t+=`- ${x.inventory_display_name||x.course_name||x.id} | 유형=${x.inventory_ledger_only?'재고원장':'신규항목'} | 입고=${n(x.stock_quantity)} | 출고=${n(x.released_quantity)} | 잔고=${n(x.stock_quantity)-n(x.released_quantity)}\n`;
 $('#out').value=t;$('#copy').disabled=false;$('#msg').textContent='점검 완료. 이제 “② 결과 복사”를 누르세요.';b.textContent='전수점검 다시 실행'}catch(e){console.error(e);$('#fatal').innerHTML=`<div class="fatal">점검 실패: ${String(e.message||e)}</div>`;b.textContent='다시 시도'}finally{b.disabled=false}}
$('#run').onclick=run;$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#out').value);$('#msg').textContent='복사 완료. 이 채팅에 그대로 붙여넣어 주세요.'}catch(e){$('#out').focus();$('#out').select();document.execCommand('copy');$('#msg').textContent='복사 완료. 이 채팅에 그대로 붙여넣어 주세요.'}};
</script></body></html>
